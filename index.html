<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d0b12" />
<title>Notch (Markus Persson) — He is Notch</title>
<style>
/* ============ base ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-snap-type: y proximity; scroll-behavior: smooth; }
body {
  background: #0d0b12; overflow-x: hidden;
  font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
}

/* ============ slides ============ */
.slide {
  position: relative; min-height: 100vh; min-height: 100svh;
  overflow: hidden; display: flex; align-items: center; justify-content: center;
  scroll-snap-align: start;
}
.bgwrap { position: absolute; inset: -8% 0; z-index: 0; will-change: transform; }
.bg {
  width: 100%; height: 100%; object-fit: cover; display: block;
  opacity: 0; transform: scale(1.07);
  transition: opacity 1.2s ease .1s;
}
.slide.in-view .bg { opacity: 1; animation: kenburns 20s ease-out forwards; }

/* 画像が読み込めるまでの予備背景(実画像が全面を覆います) */
.s1 { background: linear-gradient(180deg,#1e1440,#4a2a6e 40%,#b0562e); }
.s2 { background: linear-gradient(180deg,#a34e22,#5b3a1e 60%,#3b2412); }
.s3 { background: linear-gradient(180deg,#3b2412,#191008); }
.s4 { background: linear-gradient(180deg,#191008,#2f5d8a 30%,#7cc4ee 55%,#2f7a3f); }
.s5 { background: #9fc7e8; }
.s6 { background: linear-gradient(180deg,#10131a,#0d0b12); }

/* ============ 境目をなくすグラデーション ============ */
.slide::after {
  content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 12vh;
  z-index: 2; pointer-events: none;
  background: linear-gradient(0deg, var(--to), transparent);
}
.blendtop {
  position: absolute; top: 0; left: 0; right: 0; height: 12vh; z-index: 2;
  pointer-events: none;
  background: linear-gradient(180deg, var(--from), transparent);
}
.s1 { --to: #b35c22; }
.s2 { --from: #b35c22; --to: #3b2412; }
.s3 { --from: #3b2412; --to: #191008; }
.s4 { --from: #191008; --to: #2f7a3f; }
.s5 { --from: #2f7a3f; --to: #10131a; }
.s6 { --from: #10131a; }

/* ============ CSSだけで降る「材料」 ============ */
.fxlayer { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.blk {
  position: absolute; top: 0; left: var(--x);
  font-size: var(--s); opacity: .85; line-height: 1;
  animation: fall var(--d) linear var(--dl) infinite;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.25));
  will-change: transform;
}
@keyframes fall {
  0%   { transform: translateY(-12vh) rotate(0deg); }
  100% { transform: translateY(112vh) rotate(420deg); }
}

/* ============ スクロールのヒント ============ */
.hint { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 9px; z-index: 3; }
.hint span {
  width: 12px; height: 12px; background: #fff; border-radius: 2px; opacity: .3;
  box-shadow: 0 0 8px rgba(255,255,255,.6);
  animation: hint 1.6s ease-in-out infinite;
}
.hint span:nth-child(2) { animation-delay: .2s; }
.hint span:nth-child(3) { animation-delay: .4s; }

@keyframes hint { 0%,100% { transform: translateY(-6px); opacity: .15; } 50% { transform: translateY(4px); opacity: .9; } }
@keyframes kenburns { from { transform: scale(1.07); } to { transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .blk, .hint span { display: none; }
  .bg { animation: none !important; transition: none; opacity: 1; transform: none; }
}
</style>
</head>

<script>
(() => {
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* スクロールでスライドが見えたらCSSアニメーションを発火 */
  const io = new IntersectionObserver(
    es => es.forEach(e => e.target.classList.toggle("in-view", e.isIntersecting)),
    { threshold: .35 }
  );
  document.querySelectorAll(".slide").forEach(s => io.observe(s));

  /* ほんのりパララックス(画像レイヤーがスクロールに合わせて浮遊) */
  const px = Array.from(document.querySelectorAll("[data-depth]"));
  function loop() {
    const vh = window.innerHeight;
    px.forEach(el => {
      const host = el.closest(".slide");
      const r = host.getBoundingClientRect();
      if (r.bottom < -80 || r.top > vh + 80) return;
      const off = r.top + r.height / 2 - vh / 2;
      el.style.transform = "translate3d(0," + (off * parseFloat(el.dataset.depth)).toFixed(1) + "px,0)";
    });
    requestAnimationFrame(loop);
  }
  if (!reduced && px.length) requestAnimationFrame(loop);
})();
</script>
